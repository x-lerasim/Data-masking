name: data-masking

# Запуск: docker compose up -d
# Пароли учебные и заданы прямо здесь — это демо-стенд.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  # Вход в UI без пароля (simple auth manager, все — админы)
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  # Значения переменных с "salt" в имени Airflow заменяет на *** в логах и UI
  AIRFLOW__CORE__SENSITIVE_VAR_CONN_NAMES: "salt"
  # Драйвер ClickHouse ставится при старте контейнера — свой Dockerfile не нужен
  _PIP_ADDITIONAL_REQUIREMENTS: clickhouse-connect==1.12.0
  PYTHONPATH: /opt/airflow/project
  AIRFLOW_VAR_K_MIN: "5"            # порог k-анонимности (Variable k_min)
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  ETL_USER: etl_user
  ETL_USER_PASSWORD: etl_pass

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      ETL_USER_PASSWORD: etl_pass
      ML_USER_PASSWORD: ml_pass
    ports:
      - "8123:8123"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      retries: 30

  airflow:
    image: apache/airflow:3.4.0-python3.12
    # Соль для псевдонимов генерируется один раз при первом старте и хранится
    # как Airflow Variable masking_salt в Postgres (том pg_data), не в git.
    command:
      - bash
      - -c
      - |
        airflow db migrate > /dev/null
        airflow variables get masking_salt > /dev/null 2>&1 ||
          airflow variables set masking_salt "$$(python -c 'import secrets; print(secrets.token_hex(32))')" > /dev/null
        exec airflow standalone
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./masking:/opt/airflow/project/masking
      - ./synthetic:/opt/airflow/project/synthetic
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

volumes:
  pg_data:
  ch_data:
